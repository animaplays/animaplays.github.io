name: Sync Firebase Posts to Static HTML

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install firebase-admin
        run: npm install firebase-admin

      - name: Sync posts from Firebase
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: |
          git config user.email "bot@animaplays.github.io"
          git config user.name "Anima Play Bot"
          node .github/workflows/sync.js

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Callback — Anima Play</title>
    <style>
        body { background: #0a0a0a; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; }
        .spinner { width: 40px; height: 40px; border: 3px solid #333; border-top-color: #e50914; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error { color: #f87171; }
    </style>
</head>
<body>
    <div id="body">
        <div class="spinner"></div>
        <p>Autenticando com GitHub...</p>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const state = params.get('state');
        const error = params.get('error');
        const body = document.getElementById('body');

        function showErr(msg) {
            body.innerHTML = '<p class="error">❌ ' + msg + '</p><p style="margin-top:16px"><a href="/admin/editor.html" style="color:#e50914">Voltar ao editor</a></p>';
        }

        if (error) { showErr('Autorização rejeitada: ' + error); return; }
        if (!code) { showErr('Código de autorização não encontrado.'); return; }

        const verifier = sessionStorage.getItem('animaplay_pkce_verifier');
        if (!verifier) { showErr('Sessão expirada. Volte e tente novamente.'); return; }
        if (state && state !== sessionStorage.getItem('animaplay_state')) {
            showErr('Estado inválido. Possível ataque CSRF.'); return;
        }

        const clientId = localStorage.getItem('animaplay_client_id') || '';
        const clientSecret = localStorage.getItem('animaplay_client_secret') || '';
        const CALLBACK_URL = 'https://animaplays.github.io/admin/callback.html';

        if (!clientId || !clientSecret) {
            showErr('Credenciais do OAuth App não configuradas. Configure em ⚙ Config OAuth no editor.'); return;
        }

        // Show debug info so user can see what's happening
        body.innerHTML = '<div class="spinner"></div><p>Autenticando com GitHub...</p><p id="debug" style="font-size:11px;color:#666;margin-top:20px;text-align:left;max-width:400px;"></p>';
        const debug = document.getElementById('debug');
        function log(msg) { debug.innerHTML += '<br>' + msg; }
        log('code: ' + (code ? code.substring(0,10)+'...' : 'null'));
        log('state: ' + (state || 'null'));
        log('verifier: ' + (verifier ? 'presente' : 'ausente'));
        log('clientId: ' + (clientId ? clientId.substring(0,8)+'...' : 'null'));
        log('redirect_uri: ' + CALLBACK_URL);
        log('clientSecret: ' + (clientSecret ? 'presente ('+clientSecret.length+' chars)' : 'null'));

        fetch('https://github.com/login/oauth/access_token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify({
                client_id: clientId,
                client_secret: clientSecret,
                code: code,
                redirect_uri: CALLBACK_URL,
                code_verifier: verifier
            })
        })
        .then(res => {
            log('response status: ' + res.status);
            return res.json();
        })
        .then(data => {
            log('response: ' + JSON.stringify(data).substring(0, 200));
            if (data.error) { showErr((data.error_description || data.error).replace(/<[^>]*>/g,'')); return; }
            if (!data.access_token) { showErr('Token não recebido do GitHub.'); return; }
            localStorage.setItem('animaplay_token', data.access_token);
            sessionStorage.removeItem('animaplay_pkce_verifier');
            sessionStorage.removeItem('animaplay_state');
            body.innerHTML = '<p style="color:#4ade80;font-size:20px;margin-bottom:16px">✅ Sucesso!</p><p style="color:#aaa">Redirecionando...</p>';
            setTimeout(() => window.location.href = '/admin/editor.html', 500);
        })
        .catch(err => {
            log('catch: ' + err.message);
            showErr('Erro de rede: ' + err.message + '. Verifique o console (F12).');
        });
    </script>
</body>
</html>

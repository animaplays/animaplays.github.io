<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor — Anima Play</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0a0a0a; color: #fff; min-height: 100vh; }
        .top-bar { display: flex; align-items: center; justify-content: space-between; padding: 16px 30px; background: #111; border-bottom: 1px solid #222; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 22px; font-weight: 800; color: #e50914; }
        .nav-links { display: flex; gap: 16px; align-items: center; }
        .nav-links a { color: #888; text-decoration: none; font-size: 14px; }
        .nav-links a:hover { color: #fff; }
        .user-badge { display: flex; align-items: center; gap: 10px; background: #1a1a1a; padding: 6px 12px; border-radius: 8px; }
        .user-avatar { width: 28px; height: 28px; border-radius: 50%; }
        .btn-logout { background: none; border: none; color: #666; cursor: pointer; font-size: 12px; }
        .btn-logout:hover { color: #e50914; }

        /* Login */
        .login-page { display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 60px); }
        .login-card { background: #111; border: 1px solid #222; border-radius: 16px; padding: 40px; max-width: 440px; width: 100%; text-align: center; }
        .login-card h1 { font-size: 28px; color: #e50914; margin-bottom: 12px; }
        .login-card p { color: #888; font-size: 14px; margin-bottom: 24px; line-height: 1.6; }
        .field-group { margin-bottom: 16px; text-align: left; }
        .field-group label { display: block; font-size: 12px; color: #666; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .field-group input { width: 100%; background: #15191d; border: 1px solid #2a2a2a; border-radius: 8px; color: #fff; padding: 10px 14px; font-size: 14px; outline: none; transition: border-color 0.2s; }
        .field-group input:focus { border-color: #e50914; }
        .btn-login { background: #e50914; color: #fff; border: none; padding: 12px 28px; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; transition: background 0.2s; width: 100%; margin-top: 8px; }
        .btn-login:hover { background: #f0151f; }
        .login-hint { margin-top: 16px; font-size: 11px; color: #555; line-height: 1.6; }
        .login-hint a { color: #e50914; }
        .login-error { color: #f87171; font-size: 13px; margin-top: 12px; display: none; }

        /* Editor */
        .editor-layout { display: grid; grid-template-columns: 1fr 1fr; min-height: calc(100vh - 60px); }
        @media (max-width: 900px) { .editor-layout { grid-template-columns: 1fr; } }
        .form-panel { padding: 30px; overflow-y: auto; max-height: calc(100vh - 60px); border-right: 1px solid #1a1a1a; }
        .form-panel h2 { font-size: 18px; color: #e50914; margin-bottom: 24px; text-transform: uppercase; letter-spacing: 1px; }
        .field-group label { display: block; font-size: 12px; color: #888; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .field-group input, .field-group textarea, .field-group select { width: 100%; background: #15191d; border: 1px solid #2a2a2a; border-radius: 8px; color: #fff; padding: 10px 14px; font-size: 14px; transition: border-color 0.2s; outline: none; }
        .field-group input:focus, .field-group textarea:focus { border-color: #e50914; }
        .field-group textarea { resize: vertical; min-height: 80px; line-height: 1.5; }
        .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .slug-preview { font-size: 12px; color: #555; margin-top: 4px; }
        .slug-preview strong { color: #e50914; }

        .episode-editor { margin-top: 10px; }
        .episode-item-editor { background: #15191d; border: 1px solid #2a2a2a; border-radius: 10px; padding: 14px; margin-bottom: 10px; position: relative; }
        .ep-num { position: absolute; top: 14px; right: 14px; background: #e50914; color: #fff; font-size: 10px; padding: 2px 8px; border-radius: 4px; font-weight: 700; }
        .btn-remove-ep { background: none; border: none; color: #666; cursor: pointer; font-size: 12px; }
        .btn-remove-ep:hover { color: #e50914; }
        .btn-add-ep { background: #1a1a1a; border: 1px dashed #333; border-radius: 8px; color: #888; padding: 12px 20px; width: 100%; cursor: pointer; font-size: 14px; transition: all 0.2s; }
        .btn-add-ep:hover { border-color: #e50914; color: #e50914; }

        .btn-group { display: flex; gap: 10px; margin-top: 24px; }
        .btn-publish { background: #e50914; color: #fff; border: none; padding: 12px 28px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; transition: background 0.2s; }
        .btn-publish:hover { background: #f0151f; }
        .btn-publish:disabled { background: #333; cursor: not-allowed; }
        .btn-download { background: #1a1a1a; color: #fff; border: 1px solid #333; padding: 12px 28px; border-radius: 8px; font-size: 14px; cursor: pointer; }
        .btn-download:hover { border-color: #555; }

        .status-msg { padding: 10px 16px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; display: none; }
        .status-msg.success { display: block; background: #1a3a1a; color: #4ade80; border: 1px solid #2a4a2a; }
        .status-msg.error { display: block; background: #3a1a1a; color: #f87171; border: 1px solid #4a2a2a; }
        .status-msg.loading { display: block; background: #1a1a3a; color: #60a5fa; border: 1px solid #2a2a4a; }

        .preview-panel { overflow-y: auto; max-height: calc(100vh - 60px); background: #0a0a0a; }
        .preview-header { padding: 14px 30px; background: #111; border-bottom: 1px solid #222; display: flex; align-items: center; }
        .preview-label-dot { display: inline-block; width: 8px; height: 8px; background: #4ade80; border-radius: 50%; margin-right: 6px; }
        .preview-frame { width: 100%; min-height: calc(100vh - 110px); border: none; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="logo">Anima Play</div>
        <div class="nav-links">
            <a href="/">← Voltar ao site</a>
            <div id="userArea" class="hidden">
                <div class="user-badge">
                    <img id="userAvatar" class="user-avatar" src="" alt="">
                    <span id="userName"></span>
                    <button class="btn-logout" onclick="logout()">Sair</button>
                </div>
            </div>
        </div>
    </div>

    <!-- LOGIN -->
    <div id="loginPage" class="login-page">
        <div class="login-card">
            <h1>Anima Play</h1>
            <p>Faça login com GitHub para criar e gerenciar postagens do blog.</p>
            <div class="field-group">
                <label>Token de Acesso Pessoal</label>
                <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
            </div>
            <button class="btn-login" onclick="doLogin()">Entrar</button>
            <div id="loginError" class="login-error"></div>
            <p class="login-hint">
                Crie um token em <a href="https://github.com/settings/tokens/new" target="_blank">GitHub → Settings → Developer settings → Personal access tokens</a><br>
                Permissões necessárias: <strong>repo</strong>
            </p>
        </div>
    </div>

    <!-- EDITOR -->
    <div id="editorPage" class="editor-layout hidden">
        <div class="form-panel">
            <h2>✏️ Nova Postagem</h2>
            <div class="status-msg" id="statusMsg"></div>

            <div class="field-group">
                <label>Título do Anime *</label>
                <input type="text" id="title" placeholder="Ex: One Piece" oninput="onTitleInput()">
            </div>

            <div class="field-group">
                <label>Slug (URL) *</label>
                <input type="text" id="slug" placeholder="ex: one-piece">
                <div class="slug-preview">Path: <strong>posts/<span id="slugPreview">---</span>.html</strong></div>
            </div>

            <div class="field-row">
                <div class="field-group">
                    <label>Ano</label>
                    <input type="number" id="year" value="2024" oninput="updatePreview()">
                </div>
                <div class="field-group">
                    <label>Tipo</label>
                    <select id="type" oninput="updatePreview()">
                        <option value="TV" selected>TV</option>
                        <option value="Filme">Filme</option>
                        <option value="OVA">OVA</option>
                        <option value="Especial">Especial</option>
                    </select>
                </div>
            </div>

            <div class="field-row">
                <div class="field-group">
                    <label>Total de Episódios</label>
                    <input type="number" id="totalEpisodes" placeholder="24" oninput="updatePreview()">
                </div>
                <div class="field-group">
                    <label>Áudio</label>
                    <select id="audio" oninput="updatePreview()">
                        <option value="Dublado & Legendado" selected>Dublado & Legendado</option>
                        <option value="Dublado">Dublado</option>
                        <option value="Legendado">Legendado</option>
                    </select>
                </div>
            </div>

            <div class="field-group">
                <label>Gêneros (separados por vírgula)</label>
                <input type="text" id="genres" placeholder="Ação, Fantasia" oninput="updatePreview()">
            </div>

            <div class="field-group">
                <label>Imagem de Capa (URL)</label>
                <input type="text" id="image" placeholder="https://..." oninput="updatePreview()">
            </div>

            <div class="field-group">
                <label>Sinopse</label>
                <textarea id="synopsis" placeholder="Descrição do anime..." oninput="updatePreview()"></textarea>
            </div>

            <div class="field-group">
                <label>Vídeo Padrão (YouTube Embed URL)</label>
                <input type="text" id="defaultVideo" placeholder="https://www.youtube.com/embed/XXX" oninput="updatePreview()">
            </div>

            <div class="field-group">
                <label>Episódios</label>
                <div class="episode-editor" id="episodeList"></div>
                <button class="btn-add-ep" onclick="addEpisode()">+ Adicionar Episódio</button>
            </div>

            <div class="btn-group">
                <button class="btn-publish" id="btnPublish" onclick="publishPost()">🚀 Publicar</button>
                <button class="btn-download" onclick="downloadPost()">⬇ Download HTML</button>
            </div>
        </div>

        <div class="preview-panel">
            <div class="preview-header">
                <span><span class="preview-label-dot"></span>Preview ao vivo</span>
            </div>
            <iframe class="preview-frame" id="previewFrame" srcdoc="about:blank"></iframe>
        </div>
    </div>

    <script>
        const REPO = 'animaplays/animaplays.github.io';

        function getToken() { return localStorage.getItem('animaplay_token') || ''; }
        function saveToken(t) { localStorage.setItem('animaplay_token', t); }

        async function doLogin() {
            const input = document.getElementById('tokenInput');
            const err = document.getElementById('loginError');
            const token = input.value.trim();

            if (!token) {
                err.textContent = '⚠ Cole seu token de acesso pessoal.';
                err.style.display = 'block';
                return;
            }

            err.style.display = 'none';
            input.disabled = true;
            input.value = '';
            err.textContent = 'Verificando token...';
            err.style.color = '#60a5fa';
            err.style.display = 'block';

            try {
                const res = await fetch('https://api.github.com/user', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (!res.ok) throw new Error('Token inválido ou sem permissão.');
                const user = await res.json();
                saveToken(token);
                showEditor(user);
            } catch (e) {
                input.disabled = false;
                err.style.color = '#f87171';
                err.textContent = '❌ ' + e.message;
            }
        }

        document.getElementById('tokenInput').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

        function logout() {
            localStorage.removeItem('animaplay_token');
            location.reload();
        }

        async function checkAuth() {
            const token = getToken();
            if (!token) { showLogin(); return; }
            try {
                const res = await fetch('https://api.github.com/user', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (!res.ok) { localStorage.removeItem('animaplay_token'); showLogin(); return; }
                const user = await res.json();
                showEditor(user);
            } catch {
                localStorage.removeItem('animaplay_token');
                showLogin();
            }
        }

        function showLogin() {
            document.getElementById('loginPage').classList.remove('hidden');
            document.getElementById('editorPage').classList.add('hidden');
            document.getElementById('userArea').classList.add('hidden');
        }

        function showEditor(user) {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('editorPage').classList.remove('hidden');
            document.getElementById('userArea').classList.remove('hidden');
            document.getElementById('userAvatar').src = user.avatar_url;
            document.getElementById('userName').textContent = user.login;
            updatePreview();
        }

        // ========== SLUG ==========
        function onTitleInput() {
            const title = document.getElementById('title').value;
            const slug = title.toLowerCase()
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
            if (!document.getElementById('slug').value) {
                document.getElementById('slug').value = slug;
                updateSlugPreview();
                updatePreview();
            }
        }

        function updateSlugPreview() {
            const s = document.getElementById('slug').value || '---';
            document.getElementById('slugPreview').textContent = s;
        }
        document.getElementById('slug').addEventListener('input', updateSlugPreview);

        // ========== EPISODES ==========
        let epCount = 0;
        function addEpisode() {
            epCount++;
            const div = document.createElement('div');
            div.className = 'episode-item-editor';
            div.innerHTML = `
                <span class="ep-num">EP ${String(epCount).padStart(2,'0')}</span>
                <div class="field-group"><label>Título</label>
                    <input type="text" class="ep-title" placeholder="Episódio ${epCount}" oninput="updatePreview()"></div>
                <div class="field-group"><label>Duração / Áudio</label>
                    <input type="text" class="ep-meta" value="24 min • Dublado & Legendado" oninput="updatePreview()"></div>
                <div class="field-group"><label>URL do Vídeo (opcional)</label>
                    <input type="text" class="ep-video" placeholder="https://www.youtube.com/embed/XXX" oninput="updatePreview()"></div>
                <button class="btn-remove-ep" onclick="removeEpisode(this)">✕ Remover</button>`;
            document.getElementById('episodeList').appendChild(div);
            updatePreview();
        }
        function removeEpisode(btn) {
            btn.closest('.episode-item-editor').remove();
            document.querySelectorAll('.episode-item-editor').forEach((item, i) => {
                item.querySelector('.ep-num').textContent = 'EP ' + String(i+1).padStart(2,'0');
            });
            epCount = document.querySelectorAll('.episode-item-editor').length;
            updatePreview();
        }

        // ========== DATA ==========
        function getFormData() {
            return {
                title: document.getElementById('title').value || 'Sem Título',
                slug: document.getElementById('slug').value || 'sem-titulo',
                year: document.getElementById('year').value,
                type: document.getElementById('type').value,
                totalEpisodes: document.getElementById('totalEpisodes').value,
                audio: document.getElementById('audio').value,
                genres: document.getElementById('genres').value,
                image: document.getElementById('image').value,
                synopsis: document.getElementById('synopsis').value,
                defaultVideo: document.getElementById('defaultVideo').value,
                episodes: Array.from(document.querySelectorAll('.episode-item-editor')).map(item => ({
                    title: item.querySelector('.ep-title').value,
                    meta: item.querySelector('.ep-meta').value,
                    video: item.querySelector('.ep-video').value
                }))
            };
        }

        // ========== PREVIEW ==========
        function updatePreview() {
            const d = getFormData();
            const blob = new Blob([buildHTML(d)], { type: 'text/html' });
            document.getElementById('previewFrame').src = URL.createObjectURL(blob);
        }

        function buildHTML(d) {
            const eps = d.episodes.map((ep, i) => {
                const isNew = i === 0;
                const thumb = ep.video
                    ? `<img src="https://img.youtube.com/vi/${ytId(ep.video)}/mqdefault.jpg" class="episode-thumb" alt="EP${i+1}">`
                    : `<div class="episode-thumb" style="background:#1a1a1a;display:flex;align-items:center;justify-content:center;font-size:10px;color:#444;">EP${String(i+1).padStart(2,'0')}</div>`;
                return `<a href="#" class="episode-item${isNew?' active':''}" onclick="changeEpisode(this,'${esc(ep.video||d.defaultVideo||'')}');return false;">
                    ${thumb}
                    <div class="episode-info"><div class="ep-title">${esc(ep.title||'Episódio '+(i+1))}</div><div class="ep-meta">${esc(ep.meta||'')}</div></div>
                    ${isNew?'<span class="episode-badge">NOVO</span>':''}
                    <button class="btn-play">▶</button>
                </a>`;
            }).join('\n');

            return `<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>${esc(d.title)} — Anima Play</title>
<link rel="stylesheet" href="../style.css">
<style>
.back-link{display:inline-block;color:#e50914;text-decoration:none;font-size:14px;margin-bottom:20px;padding:0 40px}
.post-hero{position:relative;width:100%;height:400px;overflow:hidden;border-radius:0 0 16px 16px}
.post-hero img{width:100%;height:100%;object-fit:cover}
.post-hero-overlay{position:absolute;bottom:0;left:0;right:0;padding:50px 40px 25px;background:linear-gradient(transparent,#0a0a0a)}
.post-hero-overlay h1{font-size:32px;font-weight:800;margin-bottom:8px}
.post-meta{display:flex;gap:10px;flex-wrap:wrap}
.post-meta span{background:rgba(255,255,255,0.15);padding:3px 10px;border-radius:12px;font-size:12px;color:#ccc}
.post-body{max-width:900px;margin:0 auto;padding:20px 40px 40px}
.post-synopsis{color:#aaa;font-size:14px;line-height:1.7;margin-bottom:30px}
.section-label{font-size:13px;color:#e50914;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;font-weight:700}
.video-player{position:relative;width:100%;padding-top:56.25%;background:#1a1a1a;border-radius:12px;overflow:hidden;margin-bottom:24px}
.video-player iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none}
.episode-list{display:flex;flex-direction:column;gap:8px}
.episode-item{display:flex;align-items:center;gap:14px;background:#15191d;padding:12px 16px;border-radius:10px;cursor:pointer;transition:background .2s;text-decoration:none;color:#fff}
.episode-item:hover{background:#1e2428}.episode-item.active{background:#e50914}
.episode-thumb{width:90px;height:52px;border-radius:6px;object-fit:cover;background:#2a2a2a;flex-shrink:0}
.episode-info{flex:1}.ep-title{font-size:14px;font-weight:600;margin-bottom:3px}.ep-meta{font-size:12px;color:#888}
.episode-badge{background:#e50914;color:#fff;font-size:10px;padding:2px 8px;border-radius:4px;font-weight:700}
.btn-play{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.15);border:none;color:#fff;font-size:16px;cursor:pointer;flex-shrink:0;transition:background .2s}
.btn-play:hover{background:#e50914}
</style></head>
<body>
<header class="main-header"><div class="logo"><a href="/" style="color:inherit;text-decoration:none">Anima Play</a></div>
<nav><ul class="nav-links"><li><a href="/">Início</a></li><li><a href="/">Catálogo</a></li></ul></nav></header>
<a href="/" class="back-link">← Voltar ao catálogo</a>
<div class="post-hero"><img src="${esc(d.image||'https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=1200&auto=format&fit=crop')}" alt="${esc(d.title)}">
<div class="post-hero-overlay"><h1>${esc(d.title)}</h1>
<div class="post-meta"><span>${esc(d.year)}</span><span>${esc(d.type)}</span>
${d.totalEpisodes?'<span>'+esc(d.totalEpisodes)+' episódios</span>':''}
${d.genres?d.genres.split(',').map(g=>'<span>'+esc(g.trim())+'</span>').join(''):''}
<span>${esc(d.audio)}</span></div></div></div>
<main class="post-body">
${d.synopsis?'<p class="post-synopsis">'+esc(d.synopsis)+'</p>':''}
<div class="section-label">Assistir Agora</div>
<div class="video-player" id="vp"><iframe src="${esc(d.defaultVideo||'')}" title="Vídeo" allowfullscreen loading="lazy"></iframe></div>
<div class="section-label">Episódios</div>
<div class="episode-list">\n${eps}\n</div>
</main>
<footer class="main-footer"><p>&copy; 2026 Anima Play</p></footer>
<script>function changeEpisode(el,src){document.querySelectorAll('.episode-item').forEach(i=>i.classList.remove('active'));el.classList.add('active');document.getElementById('vp').querySelector('iframe').src=src}<\/script>
</body></html>`;
        }

        function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
        function ytId(url) { if (!url) return ''; const m = url.match(/[?&]v=([^&]+)/)||url.match(/embed\/([^?]+)/); return m?m[1]:''; }

        // ========== PUBLISH ==========
        async function publishPost() {
            const btn = document.getElementById('btnPublish');
            const status = document.getElementById('statusMsg');
            const data = getFormData();
            if (!data.title || !data.slug) {
                status.className = 'status-msg error'; status.textContent = '⚠ Preencha título e slug.'; return;
            }
            btn.disabled = true; btn.textContent = '⏳ Publicando...';
            status.className = 'status-msg loading'; status.textContent = '🔄 Enviando ao GitHub...';
            const html = buildHTML(data);
            const content = btoa(unescape(encodeURIComponent(html)));
            const path = 'posts/' + data.slug + '.html';
            const token = getToken();
            try {
                const res = await fetch('https://api.github.com/repos/' + REPO + '/contents/' + path, {
                    method: 'PUT',
                    headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json', 'User-Agent': 'AnimaPlay' },
                    body: JSON.stringify({ message: 'Nova postagem: ' + data.title, content })
                });
                if (!res.ok) { const err = await res.json(); throw new Error(err.message || 'Falha ao publicar'); }
                status.className = 'status-msg success'; status.textContent = '✅ Publicada!';
                window.open('https://animaplays.github.io/' + path, '_blank');
            } catch (err) {
                status.className = 'status-msg error'; status.textContent = '❌ ' + err.message;
            } finally { btn.disabled = false; btn.textContent = '🚀 Publicar'; }
        }

        // ========== DOWNLOAD ==========
        function downloadPost() {
            const data = getFormData();
            const blob = new Blob([buildHTML(data)], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url;
            a.download = 'posts/' + (data.slug || 'anime') + '.html'; a.click();
            URL.revokeObjectURL(url);
        }

        // ========== INIT ==========
        window.addEventListener('DOMContentLoaded', () => { addEpisode(); addEpisode(); addEpisode(); checkAuth(); });
    </script>
</body>
</html>

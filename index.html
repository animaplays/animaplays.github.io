<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anima Play - Catálogo de Animes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <div class="logo">Anima Play</div>
        <div class="header-tools">
            <input type="search" id="searchInput" class="search-input" placeholder="Buscar anime..." aria-label="Buscar anime">
            <div class="genre-filters" id="genreFilters" aria-label="Filtrar por gênero"></div>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="#">Início</a></li>
                <li><a href="#">Catálogo</a></li>
                <li><a href="#">Lançamentos</a></li>
            </ul>
        </nav>
    </header>

    <section class="carousel-section">
        <h2 class="section-title">Últimos Episódios</h2>
        <div class="carousel-wrapper">
            <button class="carousel-btn prev" onclick="scrollCarousel(-1)" aria-label="Anterior">&#8249;</button>
            <div class="carousel" id="carousel"></div>
            <button class="carousel-btn next" onclick="scrollCarousel(1)" aria-label="Próximo">&#8250;</button>
        </div>
    </section>

    <section class="grid-section">
        <div class="section-header">
            <h2 class="section-title">Catálogo Completo</h2>
            <span class="results-count" id="resultsCount"></span>
        </div>
        <div class="grid-layout">
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-section">
                    <h3 class="sidebar-title">Gêneros</h3>
                    <div class="genre-filters" id="genreFilters" aria-label="Filtrar por gênero"></div>
                </div>
            </aside>
            <main class="main-content">
                <div class="section-header-mobile">
                    <h2 class="section-title">Catálogo Completo</h2>
                    <span class="results-count" id="resultsCount"></span>
                </div>
                <div class="anime-grid" id="animeGrid"></div>
                <button class="load-more-btn" id="loadMoreBtn" style="display:none;">Carregar mais</button>
            </main>
        </div>
    </section>

    <footer class="main-footer">
        <p>&copy; 2026 Anima Play. Todos os direitos reservados.</p>
    </footer>

    <script>
        function cardHTML(anime) {
            const slug = anime.slug || anime.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
            const genres = anime.genres ? anime.genres.slice(0, 2).join(', ') : '';
            return `<a href="posts/${slug}.html" class="anime-card" data-title="${anime.title.toLowerCase()}" data-genres="${(anime.genres || []).join(' ').toLowerCase()}">
                <div class="card-poster-wrapper">
                    <img src="${anime.image}" alt="${anime.title}" class="card-poster" loading="lazy">
                    <div class="card-overlay"><span class="card-title-overlay">${anime.title}</span></div>
                </div>
                <div class="card-info">
                    <h3 class="card-title">${anime.title}</h3>
                    <p class="card-subtitle">${anime.subtitle || ''}</p>
                    ${genres ? `<span class="card-genres">${genres}</span>` : ''}
                </div>
            </a>`;
        }

        // Estado global
        let allAnimes = [];
        let filteredAnimes = [];
        let displayedCount = 0;
        const ITEMS_PER_LOAD = 12;

        // Elementos DOM
        const searchInput = document.getElementById('searchInput');
        const genreFilters = document.getElementById('genreFilters');
        const loadMoreBtn = document.getElementById('loadMoreBtn');
        const resultsCount = document.getElementById('resultsCount');

        async function loadPosts() {
            try {
                const res = await fetch('https://api.github.com/repos/animaplays/animaplays.github.io/contents/posts');
                if (!res.ok) return [];
                const files = await res.json();
                return files
                    .filter(f => f.name.endsWith('.html'))
                    .sort((a, b) => b.name.localeCompare(a.name))
                    .map(f => ({
                        title: f.name.replace('.html', '').replace(/-/g, ' '),
                        slug: f.name.replace('.html', ''),
                        image: 'https://image.tmdb.org/t/p/w342/dx28DE7EgLy0FatOvnaUg0k9j92.jpg',
                        subtitle: 'Nova Postagem',
                        genres: ['Nova']
                    }));
            } catch { return []; }
        }

        function getAllGenres(items) {
            const genres = new Set();
            items.forEach(item => {
                (item.genres || []).forEach(g => genres.add(g));
            });
            return Array.from(genres).sort();
        }

        function renderGenreFilters(genres) {
            genreFilters.innerHTML = `
                <button class="genre-chip active" data-genre="all" aria-pressed="true">Todos</button>
                ${genres.map(g => `<button class="genre-chip" data-genre="${g}" aria-pressed="false">${g}</button>`).join('')}
            `;
            genreFilters.querySelectorAll('.genre-chip').forEach(btn => {
                btn.addEventListener('click', () => {
                    genreFilters.querySelectorAll('.genre-chip').forEach(b => {
                        b.classList.remove('active');
                        b.setAttribute('aria-pressed', 'false');
                    });
                    btn.classList.add('active');
                    btn.setAttribute('aria-pressed', 'true');
                    applyFilters();
                });
            });
        }

        function applyFilters() {
            const searchTerm = searchInput.value.toLowerCase().trim();
            const activeGenre = document.querySelector('.genre-chip.active')?.dataset.genre || 'all';

            filteredAnimes = allAnimes.filter(anime => {
                const matchesSearch = !searchTerm || anime.title.toLowerCase().includes(searchTerm);
                const matchesGenre = activeGenre === 'all' || (anime.genres || []).some(g => g.toLowerCase() === activeGenre.toLowerCase());
                return matchesSearch && matchesGenre;
            });

            displayedCount = 0;
            renderGrid(filteredAnimes);
            updateResultsCount();
            updateLoadMoreVisibility();
        }

        function updateResultsCount() {
            const total = filteredAnimes.length;
            const showing = Math.min(displayedCount, total);
            resultsCount.textContent = `${showing} de ${total} animes`;
        }

        function updateLoadMoreVisibility() {
            loadMoreBtn.style.display = displayedCount < filteredAnimes.length ? 'block' : 'none';
        }

        function renderCarousel(items) {
            const carousel = document.getElementById('carousel');
            carousel.innerHTML = items.slice(0, 10).map(cardHTML).join('');
        }

        function renderGrid(items, append = false) {
            const grid = document.getElementById('animeGrid');
            const toShow = items.slice(displayedCount, displayedCount + ITEMS_PER_LOAD);
            
            if (!append) {
                grid.innerHTML = '';
            }
            
            toShow.forEach(anime => {
                grid.insertAdjacentHTML('beforeend', cardHTML(anime));
            });
            
            displayedCount += toShow.length;
            updateResultsCount();
            updateLoadMoreVisibility();
        }

        function scrollCarousel(dir) {
            document.getElementById('carousel').scrollBy({ left: dir * 820, behavior: 'smooth' });
        }

        // Event listeners
        let searchTimeout;
        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(applyFilters, 150);
        });

        loadMoreBtn.addEventListener('click', () => {
            renderGrid(filteredAnimes, true);
        });

        // Inicialização
        async function init() {
            const posts = await loadPosts();
            allAnimes = posts;
            
            const genres = getAllGenres(allAnimes);
            renderGenreFilters(genres);
            
            filteredAnimes = allAnimes;
            renderCarousel(allAnimes);
            renderGrid(allAnimes);
        }

        init();
    </script>

</body>
</html>

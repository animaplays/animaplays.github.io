<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anima Play - Catálogo de Animes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <div class="logo">Anima Play</div>
        <div class="header-tools">
            <input type="search" id="searchInput" class="search-input" placeholder="Buscar anime..." aria-label="Buscar anime">
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="#">Início</a></li>
                <li><a href="#">Catálogo</a></li>
                <li><a href="#">Lançamentos</a></li>
            </ul>
        </nav>
    </header>

    <div class="top-layout">
        <section class="carousel-section">
            <h2 class="section-title">Últimos Episódios</h2>
            <div class="carousel-wrapper">
                <button class="carousel-btn prev" onclick="scrollCarousel(-1)" aria-label="Anterior">&#8249;</button>
                <div class="carousel" id="carousel"></div>
                <button class="carousel-btn next" onclick="scrollCarousel(1)" aria-label="Próximo">&#8250;</button>
            </div>
        </section>
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-section">
                <h3 class="sidebar-title">Gêneros</h3>
                <div class="genre-filters" id="genreFilters" aria-label="Filtrar por gênero"></div>
            </div>
        </aside>
    </div>

    <section class="grid-section">
        <div class="section-header">
            <h2 class="section-title">Catálogo Completo</h2>
            <span class="results-count" id="resultsCount"></span>
            <button class="mobile-filter-toggle" id="filterToggle" onclick="toggleSidebar()">☰ Filtros</button>
        </div>
        <div class="anime-grid" id="animeGrid"></div>
        <button class="load-more-btn" id="loadMoreBtn" style="display:none;">Carregar mais</button>
    </section>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <footer class="main-footer">
        <p>&copy; 2026 Anima Play. Todos os direitos reservados.</p>
    </footer>

    <script>
        function cardHTML(anime) {
            const slug = anime.slug || anime.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
            const href = anime.link || `posts/${slug}.html`;
            const genres = anime.genres ? anime.genres.slice(0, 2).join(', ') : '';
            return `<a href="${href}" class="anime-card" data-title="${anime.title.toLowerCase()}" data-genres="${(anime.genres || []).join(' ').toLowerCase()}">
                <div class="card-poster-wrapper">
                    <img src="${anime.image}" alt="${anime.title}" class="card-poster" loading="lazy">
                    ${anime.isNew ? `<span class="card-badge">NOVO</span>` : ''}
                    <div class="card-overlay"><span class="card-title-overlay">${anime.title}</span></div>
                </div>
                <div class="card-info">
                    <h3 class="card-title">${anime.title}</h3>
                    <p class="card-subtitle">${anime.subtitle || ''}</p>
                    ${genres ? `<span class="card-genres">${genres}</span>` : ''}
                </div>
            </a>`;
        }

        // Estado global
        let allAnimes = [];
        let filteredAnimes = [];
        let displayedCount = 0;
        const ITEMS_PER_LOAD = 12;

        // Elementos DOM
        const searchInput = document.getElementById('searchInput');
        const genreFilters = document.getElementById('genreFilters');
        const loadMoreBtn = document.getElementById('loadMoreBtn');
        const resultsCount = document.getElementById('resultsCount');

        async function loadPosts() {
            const FALLBACK_IMG = 'https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=600&auto=format&fit=crop';
            const normImg = (u) => {
                if (!u) return FALLBACK_IMG;
                const s = String(u).trim();
                if (s.startsWith('data:') || s.startsWith('http')) return s;
                if (s.startsWith('../')) return s.replace(/^\.\.\//, '');
                return s;
            };
            try {
                const rj = await fetch('posts.json');
                if (rj.ok) {
                    const list = await rj.json();
                    if (Array.isArray(list) && list.length) {
                        const now = Date.now();
                        return list.map(p => {
                            const updatedAt = p.updatedAt || p.createdAt || '';
                            const isNew = updatedAt ? (now - new Date(updatedAt).getTime()) < 24 * 3600 * 1000 : false;
                            return {
                            title: p.title || p.slug,
                            slug: p.slug,
                            image: normImg(p.image),
                            subtitle: p.subtitle || 'Nova Postagem',
                            genres: p.genres && p.genres.length ? p.genres : ['Nova'],
                            updatedAt,
                            isNew
                            };
                        }).sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));
                    }
                }
            } catch { /* usa a API abaixo como reserva */ };
            try {
                const res = await fetch('https://api.github.com/repos/animaplays/animaplays.github.io/contents/posts');
                if (!res.ok) return [];
                const files = (await res.json())
                    .filter(f => f.name.endsWith('.html'))
                    .sort((a, b) => b.name.localeCompare(a.name));
                const posts = await Promise.all(files.map(async (f) => {
                    const slug = f.name.replace('.html', '');
                    const pretty = slug.replace(/-/g, ' ');
                    try {
                        const html = await fetchPostHTML(slug);
                        const doc = new DOMParser().parseFromString(html, 'text/html');
                        const meta = (n) => doc.querySelector(`meta[name="${n}"]`)?.content?.trim() || '';
                        const title = meta('anima-title') || doc.querySelector('.post-hero-overlay h1')?.textContent?.trim() || doc.querySelector('h1')?.textContent?.trim() || pretty;
                        let card = meta('anima-card') || doc.querySelector('.post-hero img')?.getAttribute('src') || FALLBACK_IMG;
                        if (card.startsWith('../')) card = card.replace(/^\.\.\//, '');
                        const subtitle = meta('anima-subtitle') || 'Nova Postagem';
                        const genres = meta('anima-genres') ? meta('anima-genres').split(',').map(s => s.trim()).filter(Boolean) : ['Nova'];
                        return { title, slug, image: card, subtitle, genres };
                    } catch {
                        return { title: pretty, slug, image: FALLBACK_IMG, subtitle: 'Nova Postagem', genres: ['Nova'] };
                    }
                }));
                return posts;
            } catch { return []; }
        }

        function getAllGenres(items) {
            const genres = new Set();
            items.forEach(item => {
                (item.genres || []).forEach(g => genres.add(g));
            });
            return Array.from(genres).sort();
        }

        function renderGenreFilters(genres) {
            genreFilters.innerHTML = `
                <button class="genre-chip active" data-genre="all" aria-pressed="true">Todos</button>
                ${genres.map(g => `<button class="genre-chip" data-genre="${g}" aria-pressed="false">${g}</button>`).join('')}
            `;
            genreFilters.querySelectorAll('.genre-chip').forEach(btn => {
                btn.addEventListener('click', () => {
                    genreFilters.querySelectorAll('.genre-chip').forEach(b => {
                        b.classList.remove('active');
                        b.setAttribute('aria-pressed', 'false');
                    });
                    btn.classList.add('active');
                    btn.setAttribute('aria-pressed', 'true');
                    applyFilters();
                    document.getElementById('sidebar').classList.remove('open');
                    document.getElementById('sidebarOverlay').classList.remove('visible');
                });
            });
        }

        function applyFilters() {
            const searchTerm = searchInput.value.toLowerCase().trim();
            const activeGenre = document.querySelector('.genre-chip.active')?.dataset.genre || 'all';

            filteredAnimes = allAnimes.filter(anime => {
                const matchesSearch = !searchTerm || anime.title.toLowerCase().includes(searchTerm) || (anime.subtitle || '').toLowerCase().includes(searchTerm);
                const matchesGenre = activeGenre === 'all' || (anime.genres || []).some(g => g.toLowerCase() === activeGenre.toLowerCase());
                return matchesSearch && matchesGenre;
            });

            displayedCount = 0;
            renderGrid(filteredAnimes);
            updateResultsCount();
            updateLoadMoreVisibility();
        }

        function updateResultsCount() {
            const total = filteredAnimes.length;
            const showing = Math.min(displayedCount, total);
            resultsCount.textContent = `${showing} de ${total} animes`;
        }

        function updateLoadMoreVisibility() {
            loadMoreBtn.style.display = displayedCount < filteredAnimes.length ? 'block' : 'none';
        }

        function renderCarousel(items) {
            const carousel = document.getElementById('carousel');
            carousel.innerHTML = items.slice(0, 18).map(cardHTML).join('');
        }

        async function fetchPostHTML(slug) {
            try {
                const r = await fetch(`https://api.github.com/repos/animaplays/animaplays.github.io/contents/posts/${slug}.html`);
                if (r.ok) {
                    const j = await r.json();
                    const b64 = (j.content || '').replace(/\n/g, '');
                    return decodeURIComponent(escape(atob(b64)));
                }
            } catch { /* cai para o raw abaixo */ }
            const r = await fetch(`https://raw.githubusercontent.com/animaplays/animaplays.github.io/main/posts/${slug}.html?t=${Date.now()}`);
            if (!r.ok) throw new Error('fetch fail');
            return await r.text();
        }

        async function loadLatestEpisodes(posts, perPost = 6, total = 18, maxPosts = 12) {
            const perPostLists = [];
            for (const post of posts.slice(0, maxPosts)) {
                try {
                    const html = await fetchPostHTML(post.slug);
                    const mSrc = html.match(/var EPISODES=(\[.*?\]);/s);
                    const mTit = html.match(/var EP_TITLES=(\[.*?\]);/s);
                    if (!mSrc) continue;
                    const srcs = JSON.parse(mSrc[1]);
                    let titles = [];
                    try { titles = mTit ? JSON.parse(mTit[1]) : []; } catch { titles = []; }
                    const list = [];
                    for (let i = srcs.length - 1, n = 0; i >= 0 && n < perPost; i--, n++) {
                        if (!srcs[i]) continue;
                        list.push({
                            title: titles[i] || (`Episódio ${i + 1}`),
                            subtitle: post.title,
                            image: post.image,
                            genres: post.genres,
                            isNew: post.isNew,
                            slug: post.slug,
                            link: `posts/${post.slug}.html?ep=${i + 1}`
                        });
                    }
                    if (list.length) perPostLists.push(list);
                } catch { /* ignora post com falha */ }
            }
            // Intercala: o mais novo de cada anime primeiro, depois os seguintes
            const eps = [];
            for (let round = 0; eps.length < total; round++) {
                let added = false;
                for (const list of perPostLists) {
                    if (round < list.length && eps.length < total) { eps.push(list[round]); added = true; }
                }
                if (!added) break;
            }
            return eps;
        }

        function renderGrid(items, append = false) {
            const grid = document.getElementById('animeGrid');
            const toShow = items.slice(displayedCount, displayedCount + ITEMS_PER_LOAD);
            
            if (!append) {
                grid.innerHTML = '';
            }
            
            toShow.forEach(anime => {
                grid.insertAdjacentHTML('beforeend', cardHTML(anime));
            });
            
            displayedCount += toShow.length;
            updateResultsCount();
            updateLoadMoreVisibility();
        }

        function scrollCarousel(dir) {
            const el = document.getElementById('carousel');
            el.scrollBy({ left: dir * el.clientWidth, behavior: 'smooth' });
            restartCarouselAuto();
        }

        let carouselTimer = null;

        function carouselStep() {
            const el = document.getElementById('carousel');
            if (!el || !el.children.length) return;
            const page = el.clientWidth;
            const atEnd = el.scrollLeft + page >= el.scrollWidth - 10;
            if (atEnd) {
                el.scrollTo({ left: 0, behavior: 'smooth' });
            } else {
                el.scrollBy({ left: page, behavior: 'smooth' });
            }
        }

        function startCarouselAuto() {
            stopCarouselAuto();
            carouselTimer = setInterval(carouselStep, 4000);
        }

        function stopCarouselAuto() {
            if (carouselTimer) { clearInterval(carouselTimer); carouselTimer = null; }
        }

        function restartCarouselAuto() {
            stopCarouselAuto();
            startCarouselAuto();
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('visible');
        }

        // Event listeners
        let searchTimeout;
        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(applyFilters, 150);
        });

        loadMoreBtn.addEventListener('click', () => {
            renderGrid(filteredAnimes, true);
        });

        const carouselEl = document.getElementById('carousel');
        carouselEl.addEventListener('mouseenter', stopCarouselAuto);
        carouselEl.addEventListener('mouseleave', startCarouselAuto);
        carouselEl.addEventListener('touchstart', stopCarouselAuto, { passive: true });
        carouselEl.addEventListener('touchend', startCarouselAuto);

        // Inicialização
        async function init() {
            const posts = await loadPosts();
            allAnimes = posts;
            
            const genres = getAllGenres(allAnimes);
            renderGenreFilters(genres);

            try {
                const q = new URLSearchParams(window.location.search);
                const g = q.get('genre');
                if (g) {
                    const btn = Array.from(document.querySelectorAll('.genre-chip')).find(b => b.dataset.genre.toLowerCase() === g.toLowerCase());
                    if (btn) {
                        document.querySelectorAll('.genre-chip').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-pressed', 'false'); });
                        btn.classList.add('active');
                        btn.setAttribute('aria-pressed', 'true');
                    }
                }
            } catch { /* ignora */ }
            
            filteredAnimes = allAnimes;
            applyFilters();
            const latest = await loadLatestEpisodes(allAnimes);
            renderCarousel(latest.length ? latest : allAnimes);
            startCarouselAuto();
        }

        init();
    </script>

</body>
</html>

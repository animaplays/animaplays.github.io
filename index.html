<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anima Play - Catálogo de Animes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <div class="logo">Anima Play</div>
        <nav>
            <ul class="nav-links">
                <li><a href="#">Início</a></li>
                <li><a href="#">Catálogo</a></li>
                <li><a href="#">Lançamentos</a></li>
            </ul>
        </nav>
    </header>

    <section class="carousel-section">
        <h2 class="section-title">Últimos Episódios</h2>
        <div class="carousel-wrapper">
            <button class="carousel-btn prev" onclick="scrollCarousel(-1)">&#8249;</button>
            <div class="carousel" id="carousel"></div>
            <button class="carousel-btn next" onclick="scrollCarousel(1)">&#8250;</button>
        </div>
    </section>

    <section class="grid-section">
        <h2 class="section-title">Catálogo Completo</h2>
        <div class="anime-grid" id="animeGrid"></div>
    </section>

    <footer class="main-footer">
        <p>&copy; 2026 Anima Play. Todos os direitos reservados.</p>
    </footer>

    <script>
        // Lista fixa de animes do catálogo (sem postagem própria)
        const catalogAnimes = [
            {
                title: "Bleach",
                subtitle: "T2 EP.38 • Dublado & Legendado",
                image: "https://cdn.myanimelist.net/images/anime/1736/136413.jpg",
                slug: "bleach"
            },
            {
                title: "Skeleton Knight in Another World",
                subtitle: "T1 EP.8 • Legendado",
                image: "https://cdn.myanimelist.net/images/anime/1779/110666.jpg"
            },
            {
                title: "Black Clover",
                subtitle: "T1 EP.84 • Dublado & Legendado",
                image: "https://cdn.myanimelist.net/images/anime/2/88372.jpg"
            },
            {
                title: "My Hero Academia",
                subtitle: "T8 EP.6 • Dublado & Legendado",
                image: "https://cdn.myanimelist.net/images/anime/1908/135431.jpg"
            },
            {
                title: "Shurato",
                subtitle: "T1 EP.3 • Dublado & Legendado",
                image: "https://cdn.myanimelist.net/images/anime/1269/110606.jpg"
            },
            {
                title: "Shangri-La Frontier",
                subtitle: "T1 EP.27 • Dublado & Legendado",
                image: "https://cdn.myanimelist.net/images/anime/1288/138300.jpg"
            },
            {
                title: "Demon Slayer",
                subtitle: "T4 EP.11 • Dublado & Legendado",
                image: "https://cdn.myanimelist.net/images/anime/1286/99889.jpg",
                slug: "demon-slayer"
            },
            {
                title: "Cavaleiros do Zodíaco",
                subtitle: "TV • Dublado & Legendado",
                image: "https://image.tmdb.org/t/p/w342/dx28DE7EgLy0FatOvnaUg0k9j92.jpg",
                slug: "cavaleiros"
            },
            {
                title: "Jujutsu Kaisen",
                subtitle: "T2 EP.23 • Dublado & Legendado",
                image: "https://cdn.myanimelist.net/images/anime/1792/138022.jpg"
            },
            {
                title: "One Piece",
                subtitle: "T1 EP.1100 • Dublado & Legendado",
                image: "https://cdn.myanimelist.net/images/anime/1244/138851.jpg"
            },
            {
                title: "Attack on Titan",
                subtitle: "T4 Final • Dublado & Legendado",
                image: "https://cdn.myanimelist.net/images/anime/1000/110531.jpg"
            },
            {
                title: "Chainsaw Man",
                subtitle: "T1 EP.12 • Dublado & Legendado",
                image: "https://cdn.myanimelist.net/images/anime/1806/126216.jpg"
            },
            {
                title: "Spy x Family",
                subtitle: "T2 EP.12 • Dublado & Legendado",
                image: "https://cdn.myanimelist.net/images/anime/1441/139629.jpg"
            }
        ];

        function cardHTML(anime) {
            const slug = anime.slug || anime.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
            return `<a href="posts/${slug}.html" class="anime-card">
                <div class="card-poster-wrapper">
                    <img src="${anime.image}" alt="${anime.title}" class="card-poster" loading="lazy">
                    <div class="card-overlay"><span class="card-title-overlay">${anime.title}</span></div>
                </div>
                <div class="card-info">
                    <h3 class="card-title">${anime.title}</h3>
                    <p class="card-subtitle">${anime.subtitle || ''}</p>
                </div>
            </a>`;
        }

        async function loadPosts() {
            try {
                const res = await fetch('https://api.github.com/repos/animaplays/animaplays.github.io/contents/posts');
                if (!res.ok) return [];
                const files = await res.json();
                return files
                    .filter(f => f.name.endsWith('.html'))
                    .sort((a, b) => b.name.localeCompare(a.name))
                    .map(f => ({
                        title: f.name.replace('.html', '').replace(/-/g, ' '),
                        slug: f.name.replace('.html', ''),
                        image: 'https://image.tmdb.org/t/p/w342/dx28DE7EgLy0FatOvnaUg0k9j92.jpg',
                        subtitle: 'Nova Postagem'
                    }));
            } catch { return []; }
        }

        function renderCarousel(items) {
            const carousel = document.getElementById('carousel');
            carousel.innerHTML = items.map(cardHTML).join('');
        }

        function renderGrid(items) {
            const grid = document.getElementById('animeGrid');
            grid.innerHTML = items.map(cardHTML).join('');
        }

        function scrollCarousel(dir) {
            document.getElementById('carousel').scrollBy({ left: dir * 820, behavior: 'smooth' });
        }

        // Carrega tudo
        async function init() {
            const posts = await loadPosts();
            const allItems = [...catalogAnimes, ...posts];
            renderCarousel(allItems);
            renderGrid(allItems);
        }

        init();
    </script>

</body>
</html>

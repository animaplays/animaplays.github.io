<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anima Play - Catálogo de Animes</title>
    <meta name="description" content="Anima Play - Assista seus animes favoritos online. Catálogo completo com Dragon Ball Z, Naruto Clássico e mais.">
    <meta property="og:title" content="Anima Play - Catálogo de Animes">
    <meta property="og:description" content="Assista seus animes favoritos online. Catálogo completo com Dragon Ball Z, Naruto Clássico e mais.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://animaplays.github.io/">
    <link rel="stylesheet" href="style.css?v=5">
</head>
<body>

    <header class="main-header">
        <div class="logo">Anima Play</div>
        <div class="header-tools">
            <input type="search" id="searchInput" class="search-input" placeholder="Buscar anime..." aria-label="Buscar anime">
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="/" onclick="window.scrollTo({top:0,behavior:'smooth'});return false;">Início</a></li>
                <li><a href="#catalogo">Catálogo</a></li>
                <li><a href="#catalogo" onclick="document.querySelector('.genre-chip.active')?.click();return false;">Lançamentos</a></li>
            </ul>
        </nav>
    </header>

    <div class="top-layout">
        <div class="top-main">
        <section class="carousel-section">
            <h2 class="section-title">Últimos Episódios</h2>
            <div class="carousel-wrapper">
                <button class="carousel-btn prev" onclick="scrollCarousel(-1)" aria-label="Anterior">&#8249;</button>
                <div class="carousel" id="carousel"></div>
                <button class="carousel-btn next" onclick="scrollCarousel(1)" aria-label="Próximo">&#8250;</button>
            </div>
        </section>

        <section class="genre-rows" id="genreRows" aria-label="Categorias"></section>
        </div>
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-section">
                <h3 class="sidebar-title">Animes</h3>
                <div id="postLinks"></div>
            </div>
            <div class="sidebar-section">
                <h3 class="sidebar-title">Gêneros</h3>
                <div class="genre-filters" id="genreFilters" aria-label="Filtrar por gênero"></div>
            </div>
            <div class="sidebar-section">
                <h3 class="sidebar-title">Recomendado para você</h3>
                <div id="sideRec"></div>
            </div>
        </aside>
    </div>

    <section class="grid-section" id="catalogo">
        <div class="section-header">
            <h2 class="section-title">Catálogo Completo</h2>
            <span class="results-count" id="resultsCount"></span>
            <button class="mobile-filter-toggle" id="filterToggle" onclick="toggleSidebar()">☰ Filtros</button>
        </div>
        <div class="anime-grid" id="animeGrid">
            <div id="loadingState" style="grid-column:1/-1;text-align:center;padding:60px 20px;color:#888;">
                <div style="font-size:14px;">Carregando catálogo...</div>
            </div>
        </div>
        <button class="load-more-btn" id="loadMoreBtn" style="display:none;">Carregar mais</button>
    </section>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <footer class="main-footer">
        <p>&copy; 2026 Anima Play. Todos os direitos reservados.</p>
    </footer>

    <script>
        function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

        function cardHTML(anime, rank) {
            const slug = anime.slug || anime.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
            const href = anime.link || `posts/${slug}.html`;
            const genres = anime.genres ? anime.genres.slice(0, 2).join(', ') : '';
            return `<a href="${esc(href)}" class="anime-card" data-title="${esc(anime.title.toLowerCase())}" data-genres="${esc((anime.genres || []).join(' ').toLowerCase())}">
                <div class="card-poster-wrapper">
                    <img src="${esc(anime.image)}" alt="${esc(anime.title)}" class="card-poster" loading="lazy">
                    ${anime.isNew ? `<span class="card-badge">NOVO</span>` : ''}
                    ${rank ? `<span class="rank-badge">${rank}</span>` : ''}
                    <div class="card-overlay"><span class="card-title-overlay">${esc(anime.title)}</span></div>
                </div>
                <div class="card-info">
                    <h3 class="card-title">${esc(anime.title)}</h3>
                    <p class="card-subtitle">${esc(anime.subtitle || '')}</p>
                    ${genres ? `<span class="card-genres">${esc(genres)}</span>` : ''}
                </div>
            </a>`;
        }

        // Estado global
        let allAnimes = [];
        let filteredAnimes = [];
        let displayedCount = 0;
        const ITEMS_PER_LOAD = 12;

        // Elementos DOM
        const searchInput = document.getElementById('searchInput');
        const genreFilters = document.getElementById('genreFilters');
        const loadMoreBtn = document.getElementById('loadMoreBtn');
        const resultsCount = document.getElementById('resultsCount');

        async function loadPosts() {
            const FALLBACK_IMG = 'https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=600&auto=format&fit=crop';
            const normImg = (u) => {
                if (!u) return FALLBACK_IMG;
                const s = String(u).trim();
                if (s.startsWith('data:') || s.startsWith('http')) return s;
                if (s.startsWith('../')) return s.replace(/^\.\.\//, '');
                return s;
            };
            try {
                const rj = await fetch('posts.json', { cache: 'no-store' });
                if (rj.ok) {
                    const list = await rj.json();
                    if (Array.isArray(list) && list.length) {
                        const now = Date.now();
                        return list.map(p => {
                            const updatedAt = p.updatedAt || p.createdAt || '';
                            const isNew = updatedAt ? (now - new Date(updatedAt).getTime()) < 24 * 3600 * 1000 : false;
                            return {
                            title: p.title || p.slug,
                            slug: p.slug,
                            image: normImg(p.image),
                            subtitle: p.subtitle || 'Nova Postagem',
                            genres: p.genres && p.genres.length ? p.genres : ['Nova'],
                            episodes: Array.isArray(p.episodes) ? p.episodes : [],
                            updatedAt,
                            isNew
                            };
                        }).sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));
                    }
                }
            } catch { /* ignora */ }
            return [];
        }

        function getAllGenres(items) {
            const genres = new Set();
            items.forEach(item => {
                (item.genres || []).forEach(g => genres.add(g));
            });
            return Array.from(genres).sort();
        }

        function renderGenreFilters(genres) {
            genreFilters.innerHTML = `
                <button class="genre-chip active" data-genre="all" aria-pressed="true">Todos</button>
                ${genres.map(g => `<button class="genre-chip" data-genre="${g}" aria-pressed="false">${g}</button>`).join('')}
            `;
            genreFilters.querySelectorAll('.genre-chip').forEach(btn => {
                btn.addEventListener('click', () => {
                    genreFilters.querySelectorAll('.genre-chip').forEach(b => {
                        b.classList.remove('active');
                        b.setAttribute('aria-pressed', 'false');
                    });
                    btn.classList.add('active');
                    btn.setAttribute('aria-pressed', 'true');
                    applyFilters();
                    document.getElementById('sidebar').classList.remove('open');
                    document.getElementById('sidebarOverlay').classList.remove('visible');
                    document.getElementById('catalogo').scrollIntoView({ behavior: 'smooth' });
                });
            });
        }

        function applyFilters() {
            const searchTerm = searchInput.value.toLowerCase().trim();
            const activeGenre = document.querySelector('.genre-chip.active')?.dataset.genre || 'all';

            filteredAnimes = allAnimes.filter(anime => {
                const matchesSearch = !searchTerm || anime.title.toLowerCase().includes(searchTerm) || (anime.subtitle || '').toLowerCase().includes(searchTerm);
                const matchesGenre = activeGenre === 'all' || (anime.genres || []).some(g => g.toLowerCase() === activeGenre.toLowerCase());
                return matchesSearch && matchesGenre;
            });

            displayedCount = 0;
            renderGrid(filteredAnimes);
            updateResultsCount();
            updateLoadMoreVisibility();
            renderRec();
        }

        function updateResultsCount() {
            const total = filteredAnimes.length;
            const showing = Math.min(displayedCount, total);
            resultsCount.textContent = `${showing} de ${total} animes`;
        }

        function updateLoadMoreVisibility() {
            loadMoreBtn.style.display = displayedCount < filteredAnimes.length ? 'block' : 'none';
        }

        function renderPostLinks() {
            const box = document.getElementById('postLinks');
            if (!box) return;
            const items = [...allAnimes].sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));
            box.innerHTML = items.length ? items.map(a => {
                return `<a class="post-link" href="posts/${esc(a.slug)}.html"><span>›</span> ${esc(a.title)}</a>`;
            }).join('') : '<p style="font-size:12px;color:#666;">Em breve.</p>';
        }

        function renderRec() {
            const box = document.getElementById('sideRec');
            if (!box) return;
            const active = document.querySelector('.genre-chip.active')?.dataset.genre || 'all';
            let items = [...allAnimes].sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));
            if (active !== 'all') items = items.filter(a => (a.genres || []).some(g => g.toLowerCase() === active.toLowerCase()));
            items = items.slice(0, 4);
            box.innerHTML = items.length ? items.map(a => {
                return `<a class="side-post" href="posts/${esc(a.slug)}.html"><img src="${esc(a.image)}" alt="" loading="lazy"><span>${esc(a.title)}</span></a>`;
            }).join('') : '<p style="font-size:12px;color:#666;">Em breve.</p>';
        }

        function buildGenreRows(posts) {
            const box = document.getElementById('genreRows');
            if (!box) return;
            const byDate = [...posts].sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));
            let html = `<div class="genre-row"><h3 class="genre-row-title"><span class="top10-title">Top 10 da semana</span><span class="top10-sub">Em alta no site</span></h3><div class="genre-row-scroll-wrap"><button class="row-btn prev" onclick="scrollRow(this,-1)" aria-label="Anterior">‹</button><div class="genre-row-scroll">${byDate.slice(0, 10).map((a, i) => `<div class="top10-item"><span class="rank-big">${i + 1}</span>${cardHTML(a)}</div>`).join('')}</div><button class="row-btn next" onclick="scrollRow(this,1)" aria-label="Próximo">›</button></div></div>`;
            html += getAllGenres(posts).map(g => {
                const items = posts.filter(a => (a.genres || []).some(x => x.toLowerCase() === g.toLowerCase()));
                if (!items.length) return '';
                return `<div class="genre-row"><h3 class="genre-row-title">${g}</h3><div class="genre-row-scroll">${items.slice(0, 12).map(a => cardHTML(a)).join('')}</div></div>`;
            }).join('');
            box.innerHTML = html;
        }

        function renderCarousel(items) {
            const carousel = document.getElementById('carousel');
            carousel.innerHTML = items.slice(0, 18).map(a => cardHTML(a)).join('');
        }

        function loadLatestEpisodes(posts, perPost = 6, total = 18) {
            const sorted = [...posts].sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));
            const eps = [];
            for (const post of sorted) {
                if (eps.length >= total) break;
                const srcs = post.episodes || [];
                if (!srcs.length) continue;
                for (let i = srcs.length - 1; i >= 0 && eps.length < total; i--) {
                    if (!srcs[i]) continue;
                    eps.push({
                        title: `Episódio ${i + 1}`,
                        subtitle: post.title,
                        image: post.image,
                        genres: post.genres,
                        isNew: post.isNew,
                        slug: post.slug,
                        link: `posts/${post.slug}.html?ep=${i + 1}`
                    });
                }
            }
            return eps;
        }

        function renderGrid(items, append = false) {
            const grid = document.getElementById('animeGrid');
            const loading = document.getElementById('loadingState');
            if (loading) loading.remove();
            const toShow = items.slice(displayedCount, displayedCount + ITEMS_PER_LOAD);
            
            if (!append) {
                grid.innerHTML = '';
            }
            
            if (!toShow.length && !append && !items.length) {
                grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:#888;"><div style="font-size:14px;">Nenhum anime encontrado.</div></div>';
            }
            
            toShow.forEach(anime => {
                grid.insertAdjacentHTML('beforeend', cardHTML(anime));
            });
            
            displayedCount += toShow.length;
            updateResultsCount();
            updateLoadMoreVisibility();
        }

        function scrollCarousel(dir) {
            const el = document.getElementById('carousel');
            el.scrollBy({ left: dir * el.clientWidth, behavior: 'smooth' });
            restartCarouselAuto();
        }

        function scrollRow(btn, dir) {
            const el = btn.parentElement.querySelector('.genre-row-scroll');
            if (el) el.scrollBy({ left: dir * el.clientWidth * 0.8, behavior: 'smooth' });
        }

        let carouselTimer = null;

        function carouselStep() {
            const el = document.getElementById('carousel');
            if (!el || !el.children.length) return;
            const page = el.clientWidth;
            const atEnd = el.scrollLeft + page >= el.scrollWidth - 10;
            if (atEnd) {
                el.scrollTo({ left: 0, behavior: 'smooth' });
            } else {
                el.scrollBy({ left: page, behavior: 'smooth' });
            }
        }

        function startCarouselAuto() {
            stopCarouselAuto();
            carouselTimer = setInterval(carouselStep, 4000);
        }

        function stopCarouselAuto() {
            if (carouselTimer) { clearInterval(carouselTimer); carouselTimer = null; }
        }

        function restartCarouselAuto() {
            stopCarouselAuto();
            startCarouselAuto();
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('visible');
        }

        // Event listeners
        let searchTimeout;
        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(applyFilters, 150);
        });

        loadMoreBtn.addEventListener('click', () => {
            renderGrid(filteredAnimes, true);
        });

        const carouselEl = document.getElementById('carousel');
        carouselEl.addEventListener('mouseenter', stopCarouselAuto);
        carouselEl.addEventListener('mouseleave', startCarouselAuto);
        carouselEl.addEventListener('touchstart', stopCarouselAuto, { passive: true });
        carouselEl.addEventListener('touchend', startCarouselAuto);

        // Inicialização
        async function init() {
            const posts = await loadPosts();
            allAnimes = posts;
            
            const genres = getAllGenres(allAnimes);
            renderGenreFilters(genres);

            try {
                const q = new URLSearchParams(window.location.search);
                const g = q.get('genre');
                if (g) {
                    const btn = Array.from(document.querySelectorAll('.genre-chip')).find(b => b.dataset.genre.toLowerCase() === g.toLowerCase());
                    if (btn) {
                        document.querySelectorAll('.genre-chip').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-pressed', 'false'); });
                        btn.classList.add('active');
                        btn.setAttribute('aria-pressed', 'true');
                    }
                }
            } catch { /* ignora */ }
            
            filteredAnimes = allAnimes;
            applyFilters();
            renderPostLinks();
            buildGenreRows(allAnimes);
            try {
                const q2 = new URLSearchParams(window.location.search);
                if (q2.get('genre')) {
                    const cat = document.getElementById('catalogo');
                    if (cat) cat.scrollIntoView();
                }
            } catch { /* ignora */ }
            const latest = loadLatestEpisodes(allAnimes);
            renderCarousel(latest.length ? latest : allAnimes);
            startCarouselAuto();
        }

        init();
    </script>
    <script src="update-check.js?v=5"></script>

</body>
</html>
